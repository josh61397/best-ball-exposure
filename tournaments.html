<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Best Ball Exposure — Tournaments</title>
  <script>(function(){try{var t=localStorage.getItem("bb_theme")==="dark"?"dark":"light";document.documentElement.setAttribute("data-theme",t);if(localStorage.getItem('bb_sidebar_collapsed')==='1')document.documentElement.setAttribute('data-sidebar','collapsed');}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="nav-slot"></div>
  <main>
    <h1>Tournaments</h1>


    <h2>Your entries</h2>
    <div id="your-entries"></div>

    <h2>Tournament reference</h2>
    <div class="filter-bar">
      <div class="filter-row">
        <div class="filter-group">
          <div class="filter-label">Search</div>
          <input type="search" id="ref-search" placeholder="Search tournament…" />
        </div>
        <div class="filter-group">
          <div class="filter-label">Platform</div>
          <select id="ref-platform"><option value="">All platforms</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Draft period</div>
          <select id="ref-period"><option value="">All draft periods</option></select>
        </div>
      </div>
    </div>
    <div id="ref-table"></div>
  </main>

  <footer class="site">Tournament reference data from the 2026 Best Ball Exposures Tracker template.</footer>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/tournaments.js"></script>
</body>
</html>
