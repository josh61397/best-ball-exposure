name: Refresh ADP

on:
  schedule:
    # 10:00 UTC daily ~= 6:00 AM ET / 3:00 AM PT
    - cron: "0 10 * * *"
  workflow_dispatch: {}

# Need pages + id-token to deploy to GitHub Pages directly from this
# workflow. Going cross-workflow via `gh workflow run` was failing with
# 403 because GITHUB_TOKEN doesn't have actions:write by default.
permissions:
  contents: write
  pages: write
  id-token: write

# Share the same Pages concurrency group as pages.yml so the two
# workflows can't step on each other if a human pushes and the cron
# fires close together.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Required for actions/deploy-pages — the URL fills in once the
    # deploy actually runs (it's skipped when no ADP changes).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Scrape ADP
        run: python scripts/refresh_adp.py

      - name: Commit if changed
        id: commit
        run: |
          if [[ -n "$(git status --porcelain assets/data.js data/adp.json data/history)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data.js data/adp.json data/history
            git commit -m "chore: refresh ADP $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ADP changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
