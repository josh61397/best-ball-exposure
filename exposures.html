<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Best Ball Exposure — Exposures</title>
  <script>(function(){try{var t=localStorage.getItem('bb_theme');if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bb_sidebar_collapsed')==='1')document.documentElement.setAttribute('data-sidebar','collapsed');}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="nav-slot"></div>
  <main>
    <h1>Player exposures</h1>


    <div class="filter-bar">
      <div class="filter-group">
        <div class="filter-label">Position</div>
        <div class="pos-btn-group" id="pos-filter">
          <button type="button" class="pos-btn pos-btn-all active" data-pos="">All</button>
          <button type="button" class="pos-btn pos-btn-qb"  data-pos="QB">QB</button>
          <button type="button" class="pos-btn pos-btn-rb"  data-pos="RB">RB</button>
          <button type="button" class="pos-btn pos-btn-wr"  data-pos="WR">WR</button>
          <button type="button" class="pos-btn pos-btn-te"  data-pos="TE">TE</button>
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-group">
          <div class="filter-label">Search</div>
          <input type="search" id="search" placeholder="Search player…" />
        </div>
        <div class="filter-group">
          <div class="filter-label">Platform</div>
          <select id="platform-filter"><option value="">All platforms</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Tournament</div>
          <select id="tournament-filter"><option value="">All tournaments</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Context</div>
          <select id="context-filter">
            <option value="">All</option>
            <option value="superflex">SuperFlex only</option>
            <option value="post-draft">Post-Draft (18-round)</option>
            <option value="pre-draft">Pre-Draft only</option>
          </select>
        </div>
        <div class="filter-group" style="margin-left:auto;justify-content:flex-end;">
          <div class="filter-label">&nbsp;</div>
          <label><span id="row-count">0</span> players</label>
        </div>
      </div>
    </div>

    <div id="content"></div>
  </main>

  <footer class="site">All data stored locally.</footer>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/exposures.js"></script>
</body>
</html>
