<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Best Ball Exposure — Stacks</title>
  <script>(function(){try{var t=localStorage.getItem('bb_theme');if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('bb_sidebar_collapsed')==='1')document.documentElement.setAttribute('data-sidebar','collapsed');}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="nav-slot"></div>
  <main>
    <h1>Stacks</h1>


    <div class="seg-toggle" id="view-toggle" role="tablist" style="margin-bottom:16px;">
      <button type="button" data-view="team" class="active">Team</button>
      <button type="button" data-view="player">Player</button>
      <button type="button" data-view="frequency">Stack Size</button>
    </div>

    <div class="filter-bar">
      <div class="filter-row">
        <div class="filter-group">
          <div class="filter-label">Search</div>
          <input type="search" id="search" placeholder="Search…" />
        </div>
        <div class="filter-group" data-player-only style="display:none;">
          <div class="filter-label">Stack size</div>
          <select id="size-filter">
            <option value="2">2-player stacks</option>
            <option value="3">3-player stacks</option>
          </select>
        </div>
        <div class="filter-group" data-player-only style="display:none;">
          <div class="filter-label">&nbsp;</div>
          <label class="checkbox-pill">
            <input type="checkbox" id="all-toggle" />
            <span>Show all stacks (any position)</span>
          </label>
        </div>
        <div class="filter-group">
          <div class="filter-label">Platform</div>
          <select id="platform-filter"><option value="">All platforms</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Tournament</div>
          <select id="tournament-filter"><option value="">All tournaments</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Context</div>
          <select id="context-filter">
            <option value="">All</option>
            <option value="superflex">SuperFlex only</option>
            <option value="post-draft">Post-Draft (18-round)</option>
            <option value="pre-draft">Pre-Draft only</option>
          </select>
        </div>
        <div class="filter-group" style="margin-left:auto;justify-content:flex-end;">
          <div class="filter-label">&nbsp;</div>
          <label><span id="row-count">0</span> <span id="row-label">teams</span></label>
        </div>
      </div>
    </div>

    <div id="content"></div>
  </main>

  <footer class="site">All data stored locally.</footer>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/stacks.js"></script>
</body>
</html>
