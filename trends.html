<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Best Ball Exposure — ADP Trends</title>
  <script>(function(){try{var t=localStorage.getItem("bb_theme")==="dark"?"dark":"light";document.documentElement.setAttribute("data-theme",t);if(localStorage.getItem('bb_sidebar_collapsed')==='1')document.documentElement.setAttribute('data-sidebar','collapsed');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/small%20logo.png" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="nav-slot"></div>
  <main>
    <header class="topbar"><h1 class="topbar-title">ADP trends</h1></header>

    <div class="seg-toggle" id="view-toggle" role="tablist" style="margin-bottom:16px;">
      <button type="button" data-view="chart" class="active">Chart</button>
      <button type="button" data-view="table">Table</button>
    </div>

    <!-- Shared range filter -->
    <div class="filter-bar">
      <!-- CHART VIEW filters -->
      <div class="filter-row" data-view-only="chart">
        <div class="filter-group">
          <div class="filter-label">Player</div>
          <input type="search" id="player-search" list="player-list" placeholder="Search player…" autocomplete="off" style="min-width:280px;" />
          <datalist id="player-list"></datalist>
        </div>
        <div class="filter-group">
          <div class="filter-label">Range</div>
          <select id="range">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="all">All history</option>
          </select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Compare</div>
          <div id="platform-toggles" class="platform-toggle-group">
            <label class="checkbox-pill"><input type="checkbox" data-platform="dk"><span>DraftKings</span></label>
            <label class="checkbox-pill"><input type="checkbox" data-platform="drafters"><span>Drafters</span></label>
          </div>
        </div>
        <div class="filter-group" style="margin-left:auto;justify-content:flex-end;">
          <div class="filter-label">&nbsp;</div>
          <div id="history-meta" style="color:var(--text-muted);font-size:12px;line-height:2;"></div>
        </div>
      </div>

      <!-- TABLE VIEW filters -->
      <div data-view-only="table" class="view-hidden" style="display:flex;flex-direction:column;gap:10px;">
        <div class="filter-group">
          <div class="filter-label">Position</div>
          <div class="pos-btn-group" id="table-pos-filter">
            <button type="button" class="pos-btn pos-btn-all active" data-pos="">All</button>
            <button type="button" class="pos-btn pos-btn-qb"  data-pos="QB">QB</button>
            <button type="button" class="pos-btn pos-btn-rb"  data-pos="RB">RB</button>
            <button type="button" class="pos-btn pos-btn-wr"  data-pos="WR">WR</button>
            <button type="button" class="pos-btn pos-btn-te"  data-pos="TE">TE</button>
          </div>
        </div>
        <div class="filter-row">
          <div class="filter-group">
            <div class="filter-label">Search</div>
            <input type="search" id="table-search" placeholder="Search player…" autocomplete="off" style="min-width:220px;" />
          </div>
          <div class="filter-group">
            <div class="filter-label">Range</div>
            <select id="table-range">
              <option value="7">Last 7 days</option>
              <option value="30" selected>Last 30 days</option>
              <option value="90">Last 90 days</option>
              <option value="all">All history</option>
            </select>
          </div>
          <div class="filter-group">
            <div class="filter-label">Direction</div>
            <div class="seg-toggle" id="dir-toggle" role="tablist">
              <button type="button" data-dir="all"     class="active">All</button>
              <button type="button" data-dir="risers">Risers</button>
              <button type="button" data-dir="fallers">Fallers</button>
            </div>
          </div>
          <div class="filter-group" style="margin-left:auto;justify-content:flex-end;">
            <div class="filter-label">&nbsp;</div>
            <div id="table-meta" style="color:var(--text-muted);font-size:12px;line-height:2;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- CHART VIEW content -->
    <div data-view-only="chart">
      <div id="chart-container"></div>
      <div id="legend"></div>
      <div id="player-meta" style="margin-top:16px;"></div>
    </div>

    <!-- TABLE VIEW content -->
    <div data-view-only="table" class="view-hidden">
      <div id="table-container"><div class="empty-state" style="padding:24px;">Loading…</div></div>
    </div>
  </main>

  <footer class="site">ADP snapshots committed daily by the GitHub Actions workflow.</footer>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/trends.js"></script>
</body>
</html>
