<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Best Ball Exposure — Team Construction</title>
  <script>(function(){try{var t=localStorage.getItem("bb_theme")==="dark"?"dark":"light";document.documentElement.setAttribute("data-theme",t);if(localStorage.getItem('bb_sidebar_collapsed')==='1')document.documentElement.setAttribute('data-sidebar','collapsed');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="nav-slot"></div>
  <main>
    <header class="topbar"><h1 class="topbar-title">Team construction</h1></header>


    <div class="filter-bar">
      <div class="filter-row">
        <div class="filter-group">
          <div class="filter-label">Search</div>
          <input type="search" id="search" placeholder="Search a construction (e.g. 1-7-8)…" style="min-width:240px;" />
        </div>
        <div class="filter-group">
          <div class="filter-label">Platform</div>
          <select id="platform-filter"><option value="">All platforms</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Tournament</div>
          <select id="tournament-filter"><option value="">All tournaments</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Context</div>
          <select id="context-filter">
            <option value="">All</option>
            <option value="superflex">SuperFlex only</option>
            <option value="post-draft">Post-Draft (18-round)</option>
            <option value="pre-draft">Pre-Draft only</option>
          </select>
        </div>
        <div class="filter-group" style="margin-left:auto;justify-content:flex-end;">
          <div class="filter-label">&nbsp;</div>
          <label><span id="row-count">0</span> shapes</label>
        </div>
      </div>
    </div>

    <h2 style="margin-top:8px;">Roster types <span style="color:var(--text-muted);font-size:13px;font-weight:400;">— a roster can match multiple</span></h2>
    <div id="roster-types"></div>

    <h2>Position counts per roster</h2>
    <div id="histograms"></div>

    <h2>Roster constructions</h2>
    <div id="content"></div>
  </main>

  <footer class="site">All data stored locally.</footer>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/construction.js"></script>
</body>
</html>
